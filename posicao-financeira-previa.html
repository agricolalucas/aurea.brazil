<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREA BRAZIL — Compra e Revenda</title><style>body{font:14px Arial;background:#f2f5fa;color:#163451;margin:0}header{background:#102b43;color:white;padding:18px}main{margin:25px auto;max-width:1200px;padding:15px}section{background:white;border:1px solid #dce5ef;border-radius:9px;padding:20px}h1{font-size:22px}select,input{padding:10px;border:1px solid #ccd9e7;border-radius:5px;margin:8px}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #e3ebf3;text-align:left}th{background:#edf3f9}small{color:#667}a{color:#1559aa}</style><header><b>AUREA BRAZIL</b> · Financeiro → Ordens e lançamentos → Ordens · posição financeira</header><main><h1>Ordens · posição financeira</h1><p>Visualização de Compra e Revenda — <b>prévia independente</b></p><section><label>Tipo de operação <select id="tipo"><option value="">Todos — Compra e Revenda</option><option value="payable">Somente Compra · A pagar</option><option value="receivable">Somente Revenda · A receber</option></select></label><input id="busca" placeholder="Buscar ordem ou produto"><p id="aviso">Esta página é uma prévia. A tela original do ERP não foi modificada.</p><div style="overflow:auto"><table><thead><tr><th>Ordem</th><th>Produto</th><th>Tipo</th><th>Moeda</th><th>Valor</th></tr></thead><tbody id="linhas"></tbody></table></div></section><p><a href="./">Voltar ao sistema AUREA BRAZIL</a></p></main><script>const demo=[{order_number:"CV-001",product:"Sesame Seeds",entry_type:"payable",currency:"USD",total_amount:28000},{order_number:"CV-001",product:"Sesame Seeds",entry_type:"receivable",currency:"USD",total_amount:33000},{order_number:"CV-002",product:"Popcorn",entry_type:"payable",currency:"USD",total_amount:19000},{order_number:"CV-002",product:"Popcorn",entry_type:"receivable",currency:"USD",total_amount:22800}];function render(){const t=document.querySelector('#tipo').value,q=document.querySelector('#busca').value.toLowerCase();document.querySelector('#linhas').innerHTML=demo.filter(x=>(!t||x.entry_type===t)&&(x.order_number+' '+x.product).toLowerCase().includes(q)).map(x=>'<tr><td>'+x.order_number+'</td><td>'+x.product+'</td><td>'+(x.entry_type==='payable'?'COMPRA · A pagar':'REVENDA · A receber')+'</td><td>'+x.currency+'</td><td>'+Number(x.total_amount).toLocaleString('en-US',{minimumFractionDigits:2})+'</td></tr>').join('')}document.querySelector('#tipo').onchange=render;document.querySelector('#busca').oninput=render;render()</script></html>
