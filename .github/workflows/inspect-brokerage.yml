name: Inspect brokerage UI integration points
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-brokerage.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture relevant integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          matches=[]
          needles=('renderBrokerFinance','bcOperationRows','function saveTrade','function saveTrader','function persistTrade','function isBroker','aes_trader_deals','commissionData','invoice_status','function aesBrokerFinanceSelect')
          for i,line in enumerate(lines):
              if any(n in line for n in needles):
                  # Cap long lines; no credentials or keys from unrelated code.
                  if 'supabaseUrl' in line or 'supabaseKey' in line: continue
                  matches.append(str(i+1)+': '+line[:2400])
          Path('.github/brokerage-ui-inspection.txt').write_text('\n\n'.join(matches[:65]),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/brokerage-ui-inspection.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inspect brokerage list integration points"
          git push
