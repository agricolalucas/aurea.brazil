name: Emergency restore AUREA Brazil interface
on:
  push:
    branches: [main]
    paths: ['.github/workflows/emergency-restore-interface.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove misplaced recovery script from PDF HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          broken='  <script defer src="js/receipt-recovery-preview.js"></script>\n</body></html>'
          original='  </body></html>'
          if s.count(broken)!=1:
              raise SystemExit('Expected broken insertion not found uniquely; aborting')
          s=s.replace(broken,original,1)
          if len(s)<100000:raise SystemExit('HTML size integrity check failed')
          p.write_text(s,encoding='utf-8')
          print('Restored original PDF HTML and JavaScript parsing')
          PY
      - name: Commit repaired HTML
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Emergency fix malformed script injection breaking ERP interface"
          git push
