name: Activate brokerage table layout fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-brokerage-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add scoped stylesheet to main HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="css/brokerage-table-fix.css">'
          if tag in s:
              print('Already linked')
              raise SystemExit(0)
          if '</head>' not in s or len(s)<100000: raise SystemExit('HTML integrity check failed')
          s=s.replace('</head>',tag+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Brokerage table stylesheet linked')
          PY
      - name: Commit layout correction
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate compact brokerage commission table layout"
          git push
