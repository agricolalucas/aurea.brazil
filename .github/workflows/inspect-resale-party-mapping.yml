name: Inspect resale PDF and party mapping
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-resale-party-mapping.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract resale mapping safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          terms=('ON BEHALF OF','on_behalf','function printTrade','function printTrader','function saveDeal','function saveTrade','function loadDeal','function loadTrade','trSale','data-side="sale"','data-side=\'sale\'','modelRoot(side)','sale_flow','function tradePdf')
          found=[]
          for i,line in enumerate(lines):
              if any(t in line for t in terms):
                  if any(t in line.lower() for t in ('supabasekey','service_role','apikey','authorization:')):continue
                  found.append(f'{i+1}: {line[:5000]}')
          Path('.github/resale-party-inspection.txt').write_text('\n\n'.join(found[:115]),encoding='utf-8')
          PY
      - name: Commit inspection only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/resale-party-inspection.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inspect resale party mapping before changing PDFs"
          git push
