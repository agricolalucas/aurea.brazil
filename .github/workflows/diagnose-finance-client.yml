name: Diagnose finance Supabase client
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-finance-client.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract safe client identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['aesSharedClient','createClient(','supabase.createClient','function client()','const client=','function getSupabase','window.supabase','window.sb','function saveFinanceReceipt','aesFinanceSaveMovement']
          result=[]
          for term in terms:
              pos=0
              while (pos:=s.find(term,pos))>=0:
                  left=s.rfind('\n',0,pos)+1
                  right=s.find('\n',pos)
                  if right<0:right=len(s)
                  line=s[left:right]
                  if not any(t in line.lower() for t in ('apikey','publishable','secret','service_role','sb_publishable','eyj')):
                      result.append(term+' @ '+str(s.count('\n',0,pos)+1)+': '+line[:450])
                  pos+=len(term)
                  if len(result)>100:break
          Path('.github/finance-client-diagnostic.txt').write_text('\n'.join(result),encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/finance-client-diagnostic.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Identify active Supabase client for finance receipt repair"
          git push
