name: Activate receipt recovery button
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-receipt-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link recovery scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tag='<script defer src="js/receipt-recovery-preview.js"></script>'
          if tag in s:raise SystemExit(0)
          if '</body>' not in s or len(s)<100000:raise SystemExit('HTML check failed')
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate receipt recovery discovery button"
          git push
