name: Publish receipts to bank reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-receipts-bank-reconciliation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cash reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('expenses_cash.html')
          s=p.read_text(encoding='utf-8')
          marker='AES_FINANCE_RECEIPT_CASH_REGISTER_V1'
          if marker in s:raise SystemExit('Already applied')
          old="function extraRegisterRows(){return [...orderRegisterRows(),...financialRegisterRows()];}"
          new="""/* AES_FINANCE_RECEIPT_CASH_REGISTER_V1 */
           let receiptRecords=[];
           function receiptRegisterRows(){
            const chosen=form.elements.bank.selectedOptions[0]?.textContent||'';
            const selected=String(chosen).trim().toLowerCase();
            return receiptRecords.filter(x=>String(x.currency||'USD').toUpperCase()===String(currency()).toUpperCase()).filter(x=>{
             const receiptBank=String(x.bank||'').trim().toLowerCase();
             return receiptBank&&selected&&(receiptBank===selected||selected.includes(receiptBank)||receiptBank.includes(selected));
            }).map(x=>({id:x.id,kind:'receipt',bankId:bank(),gstin:'',source:'Orders & Entries · Receipt',direction:'credit',credit:Number(x.amount||0),debit:0,invoice:x.order_number||'',date:x.movement_date||'',party:x.order_number||'Receipt',description:[x.reference,x.payment_type].filter(Boolean).join(' · '),currency:x.currency||'USD',total:Number(x.amount||0),paid:Number(x.amount||0),balance:0,status:'Available for reconciliation'})).filter(x=>x.total>0);
           }
           function extraRegisterRows(){return [...orderRegisterRows(),...financialRegisterRows(),...receiptRegisterRows()];}"""
          assert s.count(old)==1,'Register anchor changed'
          s=s.replace(old,new)
          old2="allRows('aes_cash_bank_financial_entries'),bid?allRows('aes_cash_bank_transactions'"
          new2="allRows('aes_cash_bank_financial_entries'),allRows('aes_finance_order_movements',{movement_type:'receipt'}),bid?allRows('aes_cash_bank_transactions'"
          assert s.count(old2)==1,'Query anchor changed'
          s=s.replace(old2,new2)
          old3="const [sales,expenses,orders,financial,tt,ff,mm,ii,legacy,source,statementRows]=results;"
          new3="const [sales,expenses,orders,financial,receipts,tt,ff,mm,ii,legacy,source,statementRows]=results;"
          assert s.count(old3)==1,'Results anchor changed'
          s=s.replace(old3,new3)
          old4="orderRecords=orders;financialRecords=financial;systems=source.data||[];"
          new4="orderRecords=orders;financialRecords=financial;receiptRecords=receipts;systems=source.data||[];"
          assert s.count(old4)==1,'Assignment anchor changed'
          s=s.replace(old4,new4)
          p.write_text(s,encoding='utf-8')
          print('Integrated receipt records into cash reconciliation register')
          
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expenses_cash.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show finance receipts in bank reconciliation register"
          git push
