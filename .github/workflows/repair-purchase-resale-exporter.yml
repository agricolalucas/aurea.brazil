name: Repair purchase resale exporter synchronization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-purchase-resale-exporter.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify exporter mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          mark='AES_EXPORTER_SYNC_REPAIR_V2'
          if mark in s:
              print('Already patched')
              raise SystemExit(0)
          anchor="  function sideData(side){"
          if s.count(anchor)!=1:raise SystemExit('sideData anchor mismatch')
          helper="""  /* AES_EXPORTER_SYNC_REPAIR_V2 */
          function aesSyncTradeExporter(){
            if(broker)return;
            const source=sideNode('purchase','parties','exporter');
            const target=sideNode('sale','parties','exporter');
            if(!source||!target)return;
            if(source.value && target.value!==source.value)target.value=source.value;
            target.title='Mesmo Exportador selecionado em 01 · COMPRA';
          }
          document.addEventListener('change',function(ev){
            if(broker)return;
            const source=sideNode('purchase','parties','exporter');
            if(source&&ev.target===source)aesSyncTradeExporter();
          },true);
          """
          s=s.replace(anchor,helper+anchor,1)
          anchor2="function fillSide(side,data={}){"
          if s.count(anchor2)!=1:raise SystemExit('fillSide anchor mismatch')
          # defer until purchase and sale values have both been filled
          s=s.replace(anchor2,anchor2+"if(side==='sale'&&!broker)queueMicrotask(aesSyncTradeExporter);",1)
          anchor3="function sideData(side){"
          s=s.replace(anchor3,anchor3+"if(side==='sale'&&!broker)aesSyncTradeExporter();",1)
          if len(s)<100000 or s.count(mark)!=1:raise SystemExit('Integrity check failed')
          p.write_text(s,encoding='utf-8')
          print('Purchase exporter now synchronized with resale')
          PY
      - name: Commit repaired HTML
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair exporter synchronization between purchase and resale"
          git push
